version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: freecarm-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: freecarm
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - freecarm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freecarm-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/freecarm?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this
      JWT_EXPIRES_IN: 7d
      MAX_FILE_SIZE: 10485760
      UPLOAD_PATH: ./uploads
      MODEL_PATH: ./models
      DEFAULT_LABOR_RATE: 75
      DEFAULT_PARTS_MARKUP: 1.3
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/models:/app/backend/models
    depends_on:
      - mongodb
    networks:
      - freecarm-network

volumes:
  mongodb_data:

networks:
  freecarm-network:
    driver: bridge
